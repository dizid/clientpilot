[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate"]
  external_node_modules = ["pg"]

[functions."generate-background"]
  external_node_modules = ["pg"]

[functions."get-generation-status"]
  external_node_modules = ["pg"]

[functions."regenerate-piece"]
  external_node_modules = ["pg"]

[functions."regenerate-piece-background"]
  external_node_modules = ["pg"]

[functions."get-piece-status"]
  external_node_modules = ["pg"]

# Security headers (all pages + functions)
# CSP: the sha256 hash covers the inline gtag config in index.html — if that
# script changes, recompute the hash or the analytics snippet will be blocked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-RyqZe59TcVkuhOOHDk554tMWyR7cE1PIF1C216x7ERQ=' https://www.googletagmanager.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://clientpilot-dizid.firebaseapp.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://clientpilot-dizid.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# One home for search engines: the old Netlify address forwards to the real domain
# (deploy previews use other subdomains, so they are not affected)
[[redirects]]
  from = "https://clientpilot-app.netlify.app/*"
  to = "https://clientpilot.dev/:splat"
  status = 301
  force = true

# Old link target: the plans live on the landing page
[[redirects]]
  from = "/pricing"
  to = "/#pricing"
  status = 301

# SPA fallback, only for the app's own routes (src/router/index.ts): the plain app
# shell. index.html is the prerendered landing page (scripts/prerender.mjs), which
# must not show up on /login, /workspace, ... /dashboard is Stripe's success_url
# (create-checkout.mts) and /content/* an old link; the router forwards both.
# Every other unknown path gets dist/404.html with a real 404 status (Netlify serves
# it automatically), so search engines don't index junk URLs as copies of the homepage.
# A new app route needs a line here too.
[[redirects]]
  from = "/login"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/workspace"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/generate"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/upgrade/*"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/content/*"
  to = "/app-shell.html"
  status = 200
