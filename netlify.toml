[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate"]
  external_node_modules = ["pg"]

[functions."generate-background"]
  external_node_modules = ["pg"]

[functions."get-generation-status"]
  external_node_modules = ["pg"]

[functions."regenerate-piece"]
  external_node_modules = ["pg"]

[functions."regenerate-piece-background"]
  external_node_modules = ["pg"]

[functions."get-piece-status"]
  external_node_modules = ["pg"]

# Security headers (all pages + functions)
# CSP: the sha256 hash covers the inline gtag config in index.html — if that
# script changes, recompute the hash or the analytics snippet will be blocked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-mQ+rJAfEYxpB/uAahPqnOkMn6eGGh61KiKHhfQ0JrdA=' https://www.googletagmanager.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://clientpilot-dizid.firebaseapp.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://clientpilot-dizid.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
